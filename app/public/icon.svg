<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- con/vert mark. The live widget draws this as glass over the desktop (core/src/icon.rs);
       here the glass sits on a fixed graphite backdrop. Source for `tauri icon` too. -->
  <defs>
    <clipPath id="sq"><rect width="100" height="100" rx="22.5"/></clipPath>
    <clipPath id="tl"><polygon points="0,0 95,0 0,95"/></clipPath>
    <clipPath id="br"><polygon points="100,5 100,100 5,100"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="100" height="100" fill="url(#base)"/>
    <rect width="100" height="100" fill="#fff" fill-opacity=".07"/>
    <rect width="100" height="100" fill="url(#sheen)"/>
    <line x1="-2" y1="102" x2="102" y2="-2" stroke="#000" stroke-opacity=".16" stroke-width="2.2"/>
    <line x1="-2" y1="101" x2="101" y2="-2" stroke="#fff" stroke-opacity=".75" stroke-width=".9"/>
  </g>
  <g fill="#fff">
    <g clip-path="url(#tl)">
      <rect x="16.5" y="31" width="40" height="38" rx="10" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M 33 44.2 Q 33 41.9 35 43 L 43 47.9 Q 44.9 49.2 43 50.4 L 35 55.3 Q 33 56.5 33 54.2 Z"/>
    </g>
    <g clip-path="url(#br)">
      <rect x="58" y="34" width="5.4" height="32" rx="2.7"/>
      <rect x="66.5" y="27" width="5.4" height="46" rx="2.7"/>
      <rect x="75" y="37" width="5.4" height="26" rx="2.7"/>
      <rect x="83.5" y="43" width="5.4" height="14" rx="2.7"/>
    </g>
  </g>
  <rect x=".6" y=".6" width="98.8" height="98.8" rx="22" fill="none" stroke="url(#rim)" stroke-width="1.3"/>
</svg>
